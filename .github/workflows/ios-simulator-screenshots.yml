name: Build and screenshot iOS app

on:
  workflow_dispatch:
  # Screenshot capture is manual: the unsigned IPA workflow still runs on
  # every code push, while this slower simulator gallery runs on demand.

jobs:
  screenshots:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate project
        run: xcodegen generate

      - name: Select simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "iPhone (17 Pro|16 Pro|15 Pro|16|15)" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator found" >&2
            exit 1
          fi
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $DEVICE_ID"

      - name: Build simulator app
        run: |
          xcodebuild \
            -project Nolabel.xcodeproj \
            -scheme Nolabel \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Boot simulator
        run: |
          DEVICE_ID="${{ steps.simulator.outputs.id }}"
          xcrun simctl boot "$DEVICE_ID" || true
          open -a Simulator
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time "9:41" --batteryState charged --batteryLevel 100

      - name: Install app
        run: |
          DEVICE_ID="${{ steps.simulator.outputs.id }}"
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/Nolabel.app

      - name: Capture screens
        run: |
          DEVICE_ID="${{ steps.simulator.outputs.id }}"
          BUNDLE_ID="com.h2ning.nolabel"
          mkdir -p screenshots
          capture() {
            NAME="$1"
            shift
            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID" "$@" >/dev/null
            sleep 6
            xcrun simctl io "$DEVICE_ID" screenshot "screenshots/$NAME.png"
          }
          capture bills-dark --preview --preview-screen bills --preview-theme dark
          capture bills-light --preview --preview-screen bills --preview-theme light
          capture bills-number-alt --preview --preview-screen bills --preview-theme dark --preview-number-alt
          capture bills-number-alt-light --preview --preview-screen bills --preview-theme light --preview-number-alt
          capture entry-dark --preview --preview-screen entry --preview-theme dark --preview-amount 52145
          capture entry-light --preview --preview-screen entry --preview-theme light --preview-amount 123
          capture entry-grouped --preview --preview-screen entry --preview-theme dark --preview-amount 52145 --preview-cash-mode 2
          capture entry-calc --preview --preview-screen entry --preview-theme dark --preview-amount 52145 --preview-calc
          capture entry-expression --preview --preview-screen entry --preview-theme dark --preview-amount 52145 --preview-expression
          capture entry-expression-light --preview --preview-screen entry --preview-theme light --preview-amount 52145 --preview-expression
          capture entry-negative --preview --preview-screen entry --preview-theme dark --preview-amount 52145 --preview-negative
          capture entry-backspace --preview --preview-screen entry --preview-theme dark --preview-amount 52145 --preview-backspace
          capture entry-backspace-twice --preview --preview-screen entry --preview-theme dark --preview-amount 52145 --preview-backspace-twice
          capture entry-expanded --preview --preview-screen entry --preview-theme dark --preview-amount 52145 --preview-cash-mode 3
          capture entry-piles --preview --preview-screen entry --preview-theme dark --preview-amount 4234.30
          capture entry-bundle --preview --preview-screen entry --preview-theme dark --preview-amount 100000
          capture entry-box --preview --preview-screen entry --preview-theme dark --preview-amount 1000000
          capture bills-open --preview --preview-screen bills --preview-theme dark --preview-open
          capture settings-dark --preview --preview-screen settings --preview-theme dark
          capture settings-user --preview --preview-screen settings --preview-theme dark --preview-user
          capture settings-appearance --preview --preview-screen settings --preview-theme dark --preview-settings appearance
          capture settings-number-format --preview --preview-screen settings --preview-theme dark --preview-settings number-format
          capture settings-number-format-alt --preview --preview-screen settings --preview-theme dark --preview-settings number-format --preview-number-alt
          capture settings-number-format-light --preview --preview-screen settings --preview-theme light --preview-settings number-format
          capture settings-haptics --preview --preview-screen settings --preview-theme dark --preview-settings haptics
          capture account-dark --preview --preview-screen account --preview-theme dark
          capture network-probe --preview --preview-screen settings --preview-theme dark --preview-probe
          capture network-probe-pin --preview --preview-screen settings --preview-theme dark --preview-probe --force-pin
          capture delete-confirm --preview --preview-screen bills --preview-theme dark --preview-delete-confirm
          capture cash-plaza --preview --preview-screen bills --preview-theme dark --preview-plaza
          capture cash-plaza-analysis --preview --preview-screen bills --preview-theme dark --preview-plaza --preview-plaza-analysis
          capture cash-plaza-analysis-bottom --preview --preview-screen bills --preview-theme dark --preview-plaza --preview-plaza-analysis --preview-plaza-analysis-bottom
          capture cash-plaza-analysis-light --preview --preview-screen bills --preview-theme light --preview-plaza --preview-plaza-analysis

      - name: Capture transitions
        run: |
          DEVICE_ID="${{ steps.simulator.outputs.id }}"
          BUNDLE_ID="com.h2ning.nolabel"
          mkdir -p transitions
          record() {
            NAME="$1"
            DURATION="$2"
            shift 2
            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" >/dev/null 2>&1 || true
            xcrun simctl io "$DEVICE_ID" recordVideo --codec=h264 --force "transitions/$NAME.mp4" &
            REC_PID=$!
            sleep 1
            xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID" "$@" >/dev/null
            sleep "$DURATION"
            kill -INT "$REC_PID" >/dev/null 2>&1 || true
            wait "$REC_PID" 2>/dev/null || true
          }
          record month-shift 3 --preview --preview-screen bills --preview-theme dark --preview-autoplay-month
          record entry-open 5 --preview --preview-screen bills --preview-theme dark --preview-autoplay-entry
          ls -l transitions

      - name: Upload transitions
        uses: actions/upload-artifact@v4
        with:
          name: ios-transitions
          path: transitions
          if-no-files-found: warn

      - name: Make previews
        run: |
          mkdir -p previews
          for f in screenshots/*.png; do
            name=$(basename "$f" .png)
            sips -Z 1800 -s format jpeg -s formatOptions 80 "$f" --out "previews/$name.jpg" >/dev/null
          done

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots
          if-no-files-found: error

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: ios-previews
          path: previews
          if-no-files-found: error
