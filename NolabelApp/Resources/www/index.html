<!doctype html>
<html lang="zh-CN" data-theme="dark" data-theme-mode="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1310">
  <title>诺诺 · 现金账本</title>
  <meta name="description" content="记一笔现金账，输入金额时实时看到最少张数的现钞组合。">
  <script>
    (function () {
      var mode = 'system';
      try { mode = localStorage.getItem('nolabel-theme') || 'system'; } catch (err) {}
      if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'system';
      var dark = mode === 'dark' || (mode === 'system' && window.matchMedia
        && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var theme = dark ? 'dark' : 'light';
      var root = document.documentElement;
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-theme-mode', mode);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#0b1310' : '#f2f0e8');
    })();
  </script>
  <script>
    (function () {
      var match = /\/nolabel$/i.exec(location.pathname);
      if (!match || (location.protocol !== 'http:' && location.protocol !== 'https:')) return;
      var head = document.head || document.getElementsByTagName('head')[0];
      if (!head) return;
      var base = document.createElement('base');
      base.href = location.pathname + '/';
      head.appendChild(base);
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=127">
</head>
<body>
  <main class="app" id="app">

    <!-- 账单首页 -->
    <section class="view bills-view" id="billsView" aria-label="账单">
      <header class="topbar bills-topbar">
        <button class="icon-btn settings-btn" id="settingsBtn" type="button" aria-label="设置" aria-haspopup="dialog" aria-controls="settingsDialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.25"></circle>
            <path d="M5.5 20c.65-3.25 3.1-5.15 6.5-5.15s5.85 1.9 6.5 5.15"></path>
          </svg>
        </button>

        <div class="month-switch" role="group" aria-label="切换账单月份">
          <button class="month-btn" id="prevMonthBtn" type="button" aria-label="上个月">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 5l-7 7 7 7"></path>
            </svg>
          </button>
          <span class="month-switch-divider" aria-hidden="true"></span>
          <button class="month-btn" id="nextMonthBtn" type="button" aria-label="下个月">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 5l7 7-7 7"></path>
            </svg>
          </button>
        </div>
      </header>

      <div class="bills-scroll" id="billsScroll">
        <div class="bills-heading">
          <div>
            <p class="month-label" id="monthLabel">2026年11月</p>
            <h1>账单</h1>
          </div>
          <span class="bill-count" id="billCount">0 笔</span>
        </div>

        <section class="summary-card" aria-label="所选月份收支汇总">
          <div class="summary-top">
            <span>该月支出</span>
            <span class="summary-period" id="summaryPeriod">11月</span>
          </div>
          <div class="summary-amount">
            <span class="currency" aria-hidden="true">¥</span><strong id="monthExpense">0.00</strong>
          </div>
          <div class="summary-foot">
            <span class="summary-income"><i class="seg-dot seg-dot--income" aria-hidden="true"></i>收入 <b id="monthIncome">0.00</b></span>
            <span class="summary-notes" id="monthMeta">0 笔 · 0 张现钞</span>
          </div>
        </section>

        <section class="bills-list-section" aria-labelledby="detailHeading">
          <div class="list-heading">
            <h2 id="detailHeading">账单明细</h2>
            <button class="sort-toggle" id="sortToggle" type="button" aria-pressed="true" aria-controls="billList" aria-label="当前按时间倒序，点击切换为按时间正序">按时间倒序</button>
          </div>
          <div class="bill-list" id="billList"></div>
        </section>
      </div>

      <button class="fab" id="addBillBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
        <span>记一笔</span>
      </button>
      <p class="sr-only" id="billsLive" aria-live="polite"></p>
    </section>

    <!-- 记一笔 -->
    <section class="view entry-view" id="entryView" aria-label="记一笔" aria-hidden="true" inert>
      <header class="entry-topbar">
        <button class="icon-btn" id="closeEntryBtn" type="button" aria-label="取消并返回账单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </header>
      <h1 class="sr-only" id="entryHeading" tabindex="-1">记一笔现金账</h1>

      <div class="cash-zone">
        <div class="cash-stage" id="stage" role="button" tabindex="0" aria-label="金额为零，未生成现钞" aria-describedby="breakdownText">
          <div class="stage-canvas" id="stageCanvas" aria-hidden="true">
            <div class="scene3d" id="scene3d"></div>
            <div class="grid2d" id="grid2d"></div>
          </div>
          <div class="stage-empty" id="stageEmpty"></div>
        </div>
      </div>

      <section class="entry-card" id="entryCard" aria-label="金额与备注">
        <div class="card-main">
          <div class="amount-wrap">
            <div class="amount-display" id="amountDisplay" data-empty="true" aria-live="polite" aria-atomic="true">
              <span class="amount-row">
                <span class="currency" aria-hidden="true">¥</span>
                <span class="amount-number" id="amountNumber">0.00</span>
                <span class="caret" aria-hidden="true"></span>
              </span>
            </div>
          </div>
          <div class="segmented" id="typeSeg" role="group" aria-label="收支类型">
            <span class="seg-thumb" aria-hidden="true"></span>
            <button class="seg-option is-active" type="button" data-type="expense" aria-pressed="true">
              <span class="seg-dot seg-dot--expense" aria-hidden="true"></span>支出
            </button>
            <button class="seg-option" type="button" data-type="income" aria-pressed="false">
              <span class="seg-dot seg-dot--income" aria-hidden="true"></span>收入
            </button>
          </div>
        </div>
        <div class="card-sub">
          <label class="note-row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
            </svg>
            <span class="sr-only">备注</span>
            <input class="note-input" id="noteInput" type="text" maxlength="24" placeholder="备注" autocomplete="off">
          </label>
          <button class="date-chip" type="button" id="entryDate" aria-haspopup="dialog" aria-controls="dateDialog" aria-label="修改日期和时间">11月2日</button>
        </div>
      </section>


      <div class="keypad" id="keypad" role="group" aria-label="数字键盘">
        <button class="key" type="button" data-key="7">7</button>
        <button class="key" type="button" data-key="8">8</button>
        <button class="key" type="button" data-key="9">9</button>
        <button class="key key--fn" type="button" data-key="backspace" id="backspaceBtn" aria-label="退格，长按清空">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 6H9l-6 6 6 6h12a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1Z"></path>
            <path d="m12 9 6 6M18 9l-6 6"></path>
          </svg>
        </button>

        <button class="key" type="button" data-key="4">4</button>
        <button class="key" type="button" data-key="5">5</button>
        <button class="key" type="button" data-key="6">6</button>
        <button class="key op-key" type="button" id="opBtn" aria-label="选择运算，当前加号">
          <span class="op-symbol" data-op="+">＋</span>
          <span class="op-symbol" data-op="-">－</span>
          <span class="op-symbol" data-op="*">×</span>
          <span class="op-symbol" data-op="/">÷</span>
        </button>

        <button class="key" type="button" data-key="1">1</button>
        <button class="key" type="button" data-key="2">2</button>
        <button class="key" type="button" data-key="3">3</button>
        <button class="key key--equals" type="button" id="equalsBtn" aria-label="计算结果">=</button>

        <button class="key" type="button" data-key="." aria-label="小数点">.</button>
        <button class="key" type="button" data-key="0">0</button>
        <button class="key" type="button" data-key="00" aria-label="两个零">00</button>
        <button class="key key--save" type="button" id="saveBtn" aria-label="保存这笔账" disabled>保存</button>
      </div>

      <p class="sr-only" id="breakdownText"></p>
      <p class="sr-only" id="stateLive" aria-live="polite"></p>
    </section>
  </main>

  <dialog class="date-dialog settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="date-sheet">
      <div class="date-sheet-head settings-head">
        <button class="sheet-back" id="settingsBackBtn" type="button" aria-label="返回设置" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 5l-7 7 7 7"></path>
          </svg>
        </button>
        <h2 id="settingsTitle">设置</h2>
        <button class="sheet-close" id="settingsCloseBtn" type="button" aria-label="关闭设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>

      <div class="settings-view" id="settingsMain">
        <div class="settings-card" id="accountCard" hidden>
          <div class="account-panel" id="accountPanel">
            <form class="account-form" id="accountForm" novalidate hidden>
              <label class="date-field">
                <span>用户名</span>
                <input id="accountUsername" name="username" type="text" maxlength="18" autocomplete="username" autocapitalize="none" spellcheck="false" required>
              </label>
              <label class="date-field">
                <span>密码</span>
                <input id="accountPassword" name="password" type="password" maxlength="18" autocomplete="current-password" required>
              </label>
              <button class="account-submit" id="accountLoginBtn" type="submit">登录</button>
            </form>
            <div class="account-user" id="accountUser" hidden>
              <div class="account-profile">
                <span class="account-avatar" id="accountAvatar" aria-hidden="true"></span>
                <span class="account-profile-name" id="accountUserName"></span>
              </div>
              <button class="settings-row account-logout-row" id="accountLogoutBtn" type="button">退出登录</button>
            </div>
          </div>
        </div>

        <div class="settings-card">
          <button class="settings-row settings-link" id="appearanceBtn" type="button">
            <span>外观</span>
            <span class="settings-value">
              <span id="appearanceValue">跟随系统</span>
              <svg class="settings-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 5l7 7-7 7"></path>
              </svg>
            </span>
          </button>
        </div>

        <div class="settings-card" id="transferGroup" hidden>
          <button class="settings-row account-action" id="accountImportBtn" type="button">账单导入</button>
          <button class="settings-row account-action" id="accountExportBtn" type="button">账单导出</button>
          <input class="account-file" id="accountImportFile" type="file" accept=".csv,text/csv" hidden>
        </div>

        <p class="account-message settings-message" id="accountMessage" aria-live="polite" hidden></p>
      </div>

      <div class="settings-view" id="appearanceView" hidden>
        <div class="settings-card">
          <button class="settings-row theme-option" type="button" data-theme-mode="light" aria-pressed="false"><span>浅色</span><span class="theme-check" aria-hidden="true">✓</span></button>
          <button class="settings-row theme-option" type="button" data-theme-mode="dark" aria-pressed="false"><span>深色</span><span class="theme-check" aria-hidden="true">✓</span></button>
          <button class="settings-row theme-option" type="button" data-theme-mode="system" aria-pressed="false"><span>跟随系统</span><span class="theme-check" aria-hidden="true">✓</span></button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="date-dialog" id="dateDialog" aria-labelledby="dateDialogTitle">
    <div class="date-sheet">
      <div class="date-sheet-head">
        <h2 id="dateDialogTitle">修改时间</h2>
      </div>
      <div class="date-fields">
        <label class="date-field">
          <span>日期</span>
          <input id="dateInput" type="date" required>
        </label>
        <label class="date-field">
          <span>时间</span>
          <input id="timeInput" type="time" required>
        </label>
      </div>
      <div class="date-actions">
        <button class="date-cancel" id="dateCancelBtn" type="button">取消</button>
        <button class="date-apply" id="dateApplyBtn" type="button">完成</button>
      </div>
    </div>
  </dialog>

  <script src="app.js?v=134"></script>
</body>
</html>
