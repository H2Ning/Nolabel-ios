name: Nolabel
options:
  bundleIdPrefix: com.h2ning
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Nolabel:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "26.0"
    sources:
      - path: NolabelApp/Sources
      - path: NolabelApp/Resources/Notes
        type: folder
        buildPhase: resources
      - path: NolabelApp/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.h2ning.nolabel
        PRODUCT_NAME: Nolabel
        INFOPLIST_FILE: NolabelApp/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  Nolabel:
    build:
      targets:
        Nolabel: all
    run:
      config: Debug
    archive:
      config: Release
