name: Nolabel
options:
  bundleIdPrefix: com.h2ning
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  SwiftfulHaptics:
    url: https://github.com/SwiftfulThinking/SwiftfulHaptics
    from: 2.0.5
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "5"
targets:
  Nolabel:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "26.0"
    dependencies:
      - package: SwiftfulHaptics
    sources:
      - path: NolabelApp/Sources
      - path: NolabelApp/Resources/Notes
        type: folder
        buildPhase: resources
      - path: NolabelApp/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.h2ning.nolabel
        PRODUCT_NAME: Nolabel
        INFOPLIST_FILE: NolabelApp/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-11
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-01 AppIcon-02 AppIcon-03 AppIcon-04 AppIcon-05 AppIcon-06 AppIcon-07 AppIcon-08 AppIcon-09 AppIcon-10 AppIcon-12 AppIcon-13 AppIcon-14 AppIcon-15"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
schemes:
  Nolabel:
    build:
      targets:
        Nolabel: all
    run:
      config: Debug
    archive:
      config: Release
