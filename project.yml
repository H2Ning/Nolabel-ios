name: Nolabel
options:
  bundleIdPrefix: com.h2ning
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  SwiftfulHaptics:
    url: https://github.com/SwiftfulThinking/SwiftfulHaptics
    from: 2.0.5
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.9"
    CURRENT_PROJECT_VERSION: "98"
targets:
  Nolabel:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "26.0"
    dependencies:
      - package: SwiftfulHaptics
      - target: NolabelWidgets
        embed: true
    sources:
      - path: NolabelApp/Sources
      - path: NolabelWidgets/Shared
      - path: NolabelApp/Resources/Notes
        type: folder
        buildPhase: resources
      - path: NolabelApp/Resources/Assets.xcassets
        buildPhase: resources
    entitlements:
      path: NolabelApp/Resources/Nolabel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.h2ning.nolabel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.h2ning.nolabel
        PRODUCT_NAME: Nolabel
        INFOPLIST_FILE: NolabelApp/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-11
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-01 AppIcon-02 AppIcon-03 AppIcon-04 AppIcon-05 AppIcon-06 AppIcon-07 AppIcon-08 AppIcon-09 AppIcon-10 AppIcon-12 AppIcon-13 AppIcon-14 AppIcon-15"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
  NolabelWidgets:
    type: app-extension
    subtype: widgetkit-extension
    platform: iOS
    deploymentTarget:
      iOS: "26.0"
    sources:
      - path: NolabelWidgets/Sources
      - path: NolabelWidgets/Shared
    info:
      path: NolabelWidgets/Resources/Info.plist
      properties:
        CFBundleDisplayName: 诺诺小组件
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NolabelWidgets/Resources/NolabelWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.h2ning.nolabel
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.h2ning.nolabel.widgets
        PRODUCT_NAME: NolabelWidgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  Nolabel:
    build:
      targets:
        Nolabel: all
    run:
      config: Debug
    archive:
      config: Release
